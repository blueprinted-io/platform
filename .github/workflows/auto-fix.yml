name: Auto-fix CI failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip if fix PR already open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo ${{ github.repository }} --state open \
            --json headRefName --jq '[.[].headRefName | select(startswith("autofix/"))] | length')
          echo "open_fix_prs=$count" >> $GITHUB_OUTPUT

      - name: Install uv
        if: steps.check.outputs.open_fix_prs == '0'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install dependencies
        if: steps.check.outputs.open_fix_prs == '0'
        run: uv sync --frozen --all-groups

      - name: Run fix script
        if: steps.check.outputs.open_fix_prs == '0'
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python .github/scripts/fix_ci.py \
            ${{ github.event.workflow_run.id }} \
            ${{ github.repository }}

      - name: Open fix PR
        if: steps.check.outputs.open_fix_prs == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "ci-autofix@blueprinted.io"
          git config user.name "CI Auto-fix"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          BRANCH="autofix/${{ github.event.workflow_run.head_sha }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-fix CI failure on ${{ github.event.workflow_run.head_branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --repo ${{ github.repository }} \
            --head "$BRANCH" \
            --base "${{ github.event.workflow_run.head_branch }}" \
            --title "fix: auto-fix CI failure on ${{ github.event.workflow_run.head_branch }}" \
            --body "Automated fix for CI run [${{ github.event.workflow_run.id }}](${{ github.event.workflow_run.html_url }}). Review before merging."
