name: Auto-fix CI failures

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-fix:
    # Only run for pushes from this repo (not fork PRs) — prevents untrusted
    # code from running with secrets in scope (pwn-request / workflow_run attack).
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      # Checkout the DEFAULT BRANCH — not the failing commit — so we always
      # run the trusted copy of fix_ci.py, never code from the failing branch.
      - uses: actions/checkout@v6

      - name: Skip if fix PR already open
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefName --jq '[.[].headRefName | select(startswith("autofix/"))] | length')
          echo "open_fix_prs=$count" >> $GITHUB_OUTPUT

      - name: Install uv
        if: steps.check.outputs.open_fix_prs == '0'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install dependencies
        if: steps.check.outputs.open_fix_prs == '0'
        run: uv sync --frozen --all-groups

      - name: Run fix script
        if: steps.check.outputs.open_fix_prs == '0'
        env:
          SYNTHETIC_API_KEY: ${{ secrets.SYNTHETIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          uv run python .github/scripts/fix_ci.py "$RUN_ID" "$REPO" "$HEAD_SHA"

      - name: Open fix PR
        if: steps.check.outputs.open_fix_prs == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # Validate branch name before using it in shell commands
          [[ "$HEAD_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid branch name"; exit 1; }

          git config user.email "ci-autofix@blueprinted.io"
          git config user.name "CI Auto-fix"

          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi

          BRANCH="autofix/${HEAD_SHA}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-fix CI failure on ${HEAD_BRANCH}"
          git push origin "$BRANCH"

          gh pr create \
            --repo "${{ github.repository }}" \
            --head "$BRANCH" \
            --base "$HEAD_BRANCH" \
            --title "fix: auto-fix CI failure on ${HEAD_BRANCH}" \
            --body "Automated fix for CI run [${RUN_ID}](${RUN_URL}). Review before merging."
