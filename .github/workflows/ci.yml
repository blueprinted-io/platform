name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: blueprinted
          POSTGRES_PASSWORD: blueprinted
          POSTGRES_DB: blueprinted_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg2://blueprinted:blueprinted@localhost:5432/blueprinted_test
        run: uv run alembic -c migrations/alembic.ini upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://blueprinted:blueprinted@localhost:5432/blueprinted_test
          DATABASE_URL_SYNC: postgresql+psycopg2://blueprinted:blueprinted@localhost:5432/blueprinted_test
          REDIS_URL: redis://localhost:6379/1
          APP_SECRET_KEY: ci-test-secret-not-for-production
        run: uv run pytest --cov=api --cov=workers --cov=cli --cov-report=term-missing

      - name: Ruff
        run: uv run ruff check .

      - name: mypy
        run: uv run mypy api/ cli/ workers/

      - name: pip-audit
        run: uv run pip-audit
